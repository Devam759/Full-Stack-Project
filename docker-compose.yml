services:
  mongo:
    image: mongo:7.0
    container_name: borrowloop-mongo
    restart: always
    ports:
      - '27017:27017'
    entrypoint:
      - '/usr/bin/mongod'
      - '--replSet'
      - 'rs0'
      - '--bind_ip_all'
      - '--port'
      - '27017'
    healthcheck:
      test: >
        mongosh --port 27017 --quiet --eval "
          try {
            rs.status().ok;
          } catch (e) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: '127.0.0.1:27017' }]
            }).ok;
          }
        "
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: borrowloop-redis
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
