name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Start MongoDB Replica Set (without keyfile, directConnection=true)
        run: |
          docker run -d --name mongo-ci -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          sleep 4
          docker exec mongo-ci mongosh --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          sleep 2
          docker exec mongo-ci mongosh --eval "rs.status()"

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: Lint codebase (ESLint)
        run: npm run lint

      - name: Run all tests (Vitest)
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/borrowloop_test?replicaSet=rs0&directConnection=true
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: test
        run: npm test

      - name: Build applications
        run: npm run build
